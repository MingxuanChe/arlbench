name: "MountainCarContinuous-v0"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

env_params: {}

# Domain randomization configuration for MountainCarContinuous-v0
# Nominal values: power=0.0015, gravity=0.0025
domain_randomization:
  power:
    distribution: "normal"
    mean: 0.0015      # Nominal value
    std: 0.00045      # 30% std
    clip_min: 0.0009  # 60% of nominal
    clip_max: 0.0021  # 140% of nominal
  gravity:
    distribution: "uniform"
    min_value: 0.0015 # 60% of nominal (0.0025)
    max_value: 0.0035 # 140% of nominal

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  power:
    distribution: "normal"
    mean: 0.0015
    std: 0.00045
    clip_min: 0.0009
    clip_max: 0.0021
  gravity:
    distribution: "uniform"
    min_value: 0.0015
    max_value: 0.0035
