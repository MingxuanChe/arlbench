name: "MountainCarContinuous-v0"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

env_params: {}

# Domain randomization configuration for MountainCarContinuous-v0
# Nominal values: power=0.0015, gravity=0.0025
# Range: 50% – 150% of nominal (uniform)
domain_randomization:
  power:
    distribution: "uniform"
    min_value: 0.00075   # 50% of nominal (0.0015)
    max_value: 0.00225   # 150% of nominal
  gravity:
    distribution: "uniform"
    min_value: 0.00125   # 50% of nominal (0.0025)
    max_value: 0.00375   # 150% of nominal

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  power:
    distribution: "uniform"
    min_value: 0.00075
    max_value: 0.00225
  gravity:
    distribution: "uniform"
    min_value: 0.00125
    max_value: 0.00375
