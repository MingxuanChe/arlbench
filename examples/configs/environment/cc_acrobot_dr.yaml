name: "Acrobot-v1"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

env_params: {}

# Domain randomization configuration for Acrobot-v1
# Nominal values: link_mass_1=1.0, link_mass_2=1.0
# Randomizing only masses (2 dimensions) for simplicity
domain_randomization:
  link_mass_1:
    distribution: "normal"
    mean: 1.0        # Nominal value
    std: 0.3         # 30% std
    clip_min: 0.5    # 50% of nominal
    clip_max: 1.5    # 150% of nominal
  link_mass_2:
    distribution: "normal"
    mean: 1.0        # Nominal value
    std: 0.3         # 30% std
    clip_min: 0.5    # 50% of nominal
    clip_max: 1.5    # 150% of nominal
  # link_com_pos_1:
  #   distribution: "normal"
  #   mean: 0.5
  #   std: 0.1         # 20% std
  #   clip_min: 0.4    # 80% of default
  #   clip_max: 0.6    # 120% of default
  # link_com_pos_2:
  #   distribution: "normal"
  #   mean: 0.5
  #   std: 0.1         # 20% std
  #   clip_min: 0.4    # 80% of default
  #   clip_max: 0.6    # 120% of default

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  link_mass_1:
    distribution: "normal"
    mean: 1.0
    std: 0.3
    clip_min: 0.5
    clip_max: 1.5
  link_mass_2:
    distribution: "normal"
    mean: 1.0
    std: 0.3
    clip_min: 0.5
    clip_max: 1.5
