name: "Acrobot-v1"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

env_params: {}

# Domain randomization configuration for Acrobot-v1
# Nominal values: link_mass_1=1.0, link_mass_2=1.0
# Range: 25% – 200% of nominal (uniform)
domain_randomization:
  link_mass_1:
    distribution: "uniform"
    min_value: 0.25   # 25% of nominal
    max_value: 2.0    # 200% of nominal
  link_mass_2:
    distribution: "uniform"
    min_value: 0.25   # 25% of nominal
    max_value: 2.0    # 200% of nominal

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  link_mass_1:
    distribution: "uniform"
    min_value: 0.25
    max_value: 2.0
  link_mass_2:
    distribution: "uniform"
    min_value: 0.25
    max_value: 2.0
