name: "CartPole-v1"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

# Static environment parameters (optional)
env_params: {}

# Domain randomization configuration for CartPole-v1
# Nominal values: masspole=0.1, length=0.5
# Range: 25% – 200% of nominal (uniform)
domain_randomization:
  masspole:
    distribution: "uniform"
    min_value: 0.025   # 25% of nominal (0.1)
    max_value: 0.2     # 200% of nominal
  length:
    distribution: "uniform"
    min_value: 0.125   # 25% of nominal (0.5)
    max_value: 1.0     # 200% of nominal

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  masspole:
    distribution: "uniform"
    min_value: 0.025
    max_value: 0.2
  length:
    distribution: "uniform"
    min_value: 0.125
    max_value: 1.0
