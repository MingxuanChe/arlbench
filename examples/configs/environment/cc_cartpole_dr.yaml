name: "CartPole-v1"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

# Static environment parameters (optional)
env_params: {}

# Domain randomization configuration for CartPole-v1
# Nominal values: masspole=0.1, length=0.5
# Range: 50% – 150% of nominal (uniform)
domain_randomization:
  masspole:
    distribution: "uniform"
    min_value: 0.05   # 50% of nominal (0.1)
    max_value: 0.15   # 150% of nominal
  length:
    distribution: "uniform"
    min_value: 0.25   # 50% of nominal (0.5)
    max_value: 0.75   # 150% of nominal

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  masspole:
    distribution: "uniform"
    min_value: 0.05
    max_value: 0.15
  length:
    distribution: "uniform"
    min_value: 0.25
    max_value: 0.75
