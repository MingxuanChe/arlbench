name: "MountainCar-v0"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

env_params: {}

# Domain randomization configuration for MountainCar-v0
# Nominal values: force=0.001, gravity=0.0025
# Range: 50% – 150% of nominal (uniform)
domain_randomization:
  force:
    distribution: "uniform"
    min_value: 0.0005    # 50% of nominal (0.001)
    max_value: 0.0015    # 150% of nominal
  gravity:
    distribution: "uniform"
    min_value: 0.00125   # 50% of nominal (0.0025)
    max_value: 0.00375   # 150% of nominal

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  force:
    distribution: "uniform"
    min_value: 0.0005
    max_value: 0.0015
  gravity:
    distribution: "uniform"
    min_value: 0.00125
    max_value: 0.00375
