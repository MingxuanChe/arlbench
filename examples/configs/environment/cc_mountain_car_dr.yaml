name: "MountainCar-v0"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

env_params: {}

# Domain randomization configuration for MountainCar-v0
# Nominal values: force=0.001, gravity=0.0025
domain_randomization:
  force:
    distribution: "normal"
    mean: 0.001      # Nominal value
    std: 0.0003      # 30% std
    clip_min: 0.0005 # 50% of nominal
    clip_max: 0.0015 # 150% of nominal
  gravity:
    distribution: "uniform"
    min_value: 0.0015  # 60% of nominal (0.0025)
    max_value: 0.0035  # 140% of nominal

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  force:
    distribution: "normal"
    mean: 0.001
    std: 0.0003
    clip_min: 0.0005
    clip_max: 0.0015
  gravity:
    distribution: "uniform"
    min_value: 0.0015
    max_value: 0.0035
