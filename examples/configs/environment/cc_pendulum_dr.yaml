name: "Pendulum-v1"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

env_params: {}

# Domain randomization configuration for Pendulum-v1
domain_randomization:
  # max_torque:
  #   distribution: "uniform"
  #   min_value: 1.6   # 80% of default (2.0)
  #   max_value: 2.4   # 120% of default
  # g:
  #   distribution: "uniform"
  #   min_value: 8.0   # 80% of default (10.0)
  #   max_value: 12.0  # 120% of default
  m:
    distribution: "normal"
    mean: 1.0
    std: 0.2         # 20% std
    clip_min: 0.7    # 70% of default
    clip_max: 1.3    # 130% of default
  l:
    distribution: "normal"
    mean: 1.0
    std: 0.15        # 15% std
    clip_min: 0.8    # 80% of default
    clip_max: 1.2    # 120% of default

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  # max_torque:
  #   distribution: "uniform"
  #   min_value: 1.6
  #   max_value: 2.4
  # g:
  #   distribution: "uniform"
  #   min_value: 8.0
  #   max_value: 12.0
  m:
    distribution: "normal"
    mean: 1.0
    std: 0.2
    clip_min: 0.7
    clip_max: 1.3
  l:
    distribution: "normal"
    mean: 1.0
    std: 0.15
    clip_min: 0.8
    clip_max: 1.2
