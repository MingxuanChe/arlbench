name: "Pendulum-v1"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

env_params: {}

# Domain randomization configuration for Pendulum-v1
# Nominal values: m=1.0, l=1.0
# Range: 50% – 150% of nominal (uniform)
domain_randomization:
  m:
    distribution: "uniform"
    min_value: 0.5   # 50% of nominal (1.0)
    max_value: 1.5   # 150% of nominal
  l:
    distribution: "uniform"
    min_value: 0.5   # 50% of nominal (1.0)
    max_value: 1.5   # 150% of nominal

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  m:
    distribution: "uniform"
    min_value: 0.5
    max_value: 1.5
  l:
    distribution: "uniform"
    min_value: 0.5
    max_value: 1.5
