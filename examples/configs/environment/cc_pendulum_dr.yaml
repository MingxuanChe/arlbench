name: "Pendulum-v1"
framework: "gymnax"
n_total_timesteps: 1e5
kwargs: {}
eval_kwargs: {}
cnn_policy: False
deterministic_eval: True
jax_enable_x64: False
n_envs: 8

env_params: {}

# Domain randomization configuration for Pendulum-v1
# Nominal values: m=1.0, l=1.0, g=10.0, max_torque=2.0
domain_randomization:
  m:
    distribution: "normal"
    mean: 1.0        # Nominal value
    std: 0.2         # 20% std
    clip_min: 0.7    # 70% of nominal
    clip_max: 1.3    # 130% of nominal
  l:
    distribution: "normal"
    mean: 1.0        # Nominal value
    std: 0.15        # 15% std
    clip_min: 0.8    # 80% of nominal
    clip_max: 1.2    # 120% of nominal

# Evaluation domain randomization (same distribution as training)
eval_domain_randomization:
  # max_torque:
  #   distribution: "uniform"
  #   min_value: 1.6
  #   max_value: 2.4
  # g:
  #   distribution: "uniform"
  #   min_value: 8.0
  #   max_value: 12.0
  m:
    distribution: "normal"
    mean: 1.0
    std: 0.2
    clip_min: 0.7
    clip_max: 1.3
  l:
    distribution: "normal"
    mean: 1.0
    std: 0.15
    clip_min: 0.8
    clip_max: 1.2
