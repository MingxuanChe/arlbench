[workspace]
authors = ["Mingxuan Che <mxche2019@outlook.com>"]
channels = ["conda-forge"]
name = "arlbench"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
clean-build = "rm -rf build/ dist/ .eggs/ ARLBench.egg-info && (find . -path './.pixi' -prune -o -name '*.egg-info' -type d -print | xargs rm -rf 2>/dev/null || true) && (find . -name '*.egg' -type f -print | xargs rm -f 2>/dev/null || true)"
clean-pyc = "(find . -path './.pixi' -prune -o \\( -name '*.pyc' -o -name '*.pyo' -o -name '*~' \\) -type f -print | xargs rm -f 2>/dev/null || true) && (find . -path './.pixi' -prune -o -name '__pycache__' -type d -print | xargs rm -rf 2>/dev/null || true)"
clean-test = "rm -rf .tox/ .coverage htmlcov/ .pytest_cache"
clean = { depends-on = ["clean-build", "clean-pyc", "clean-test"] }
install = { depends-on = ["clean"], cmd = "pip install -e ." }
install-dev = { depends-on = ["clean"], cmd = "pip install -e '.[dev,examples]'" }
install-envpool = { depends-on = ["clean"], cmd = "pip install -e '.[envpool]'" }
install-envpool-dev = { depends-on = ["clean"], cmd = "pip install -e '.[dev,examples,envpool]'" }
check = "pre-commit run --all-files"
test = "pytest tests/"

[dependencies]
python = "3.10.*"
pip = "*"
cuda-version = "12.*"
cudnn = ">=8.9"

[activation.env]
CUDA_VISIBLE_DEVICES = "0"
# Force JAX to use compute capability 8.9 (Hopper/Ada compatible mode for newer GPUs)
XLA_FLAGS = "--xla_gpu_cuda_data_dir=$CONDA_PREFIX --xla_gpu_force_compilation_parallelism=1"
JAX_PLATFORMS = "cuda"

[pypi-dependencies]
typing_extensions = "*"
numpy = "==1.26.4"
tomli = "==2.0.1"
pre-commit = "==3.7.0"
codecarbon = "==2.3.5"
memray = "==1.12.0"
pathos = "==0.3.2"
jax = { version = "==0.4.33", extras = ["cuda12"] }
jaxlib = "==0.4.33"
flashbax = "==0.1.2"
gymnax = "==0.0.6"
chex = ">=0.1.86"
ConfigSpace = "==1.2.1"
distrax = "==0.1.5"
flax = "==0.10.0"
brax = "==0.10.3"
warp-lang = "*"
pytest = "==7.4.4"
coverage = "==7.4.4"
xminigrid = "==0.8.0"
gymnasium = "==1.2.0"
hydra-core = "==1.3.2"
hydra-submitit-launcher = "*"
hydra_colorlog = "*"

[feature.envpool.pypi-dependencies]
envpool = "==0.8.4"

[feature.dev.pypi-dependencies]
ruff = "==0.4.0"
bump-my-version = "==0.20.1"
twine = "==5.0.0"
mypy = "==1.9.0"
pytest-coverage = "*"
pytest-cases = "==3.8.5"

[feature.examples.pypi-dependencies]
hypersweeper = "==0.2.0"

[feature.doc.pypi-dependencies]
automl_sphinx_theme = "==0.2.0"
sphinx-toolbox = "==3.5.0"
sphinx-autodoc-typehints = "==2.1.0"
myst-parser = "==2.0.0"
sphinx-tabs = "==3.4.5"
sphinx = "==7.3.7"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev", "examples"], solve-group = "default" }
envpool = { features = ["envpool"], solve-group = "default" }
envpool-dev = { features = ["envpool", "dev", "examples"], solve-group = "default" }
doc = { features = ["doc"], solve-group = "default" }
